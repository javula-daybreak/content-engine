<section class="slide{bg}" data-step="{step}">
  <div class="top"><span class="eyebrow">{eyebrow}</span></div>
  <div class="body">
    <h1 class="h1 big">{headline}</h1>
    <div class="rule"></div>
    {lead_html}
  </div>
  <div class="foot">
    <div class="wm"><span class="mark"></span>{wordmark}</div>
    <span class="cue">{cue}&nbsp;&rarr;</span>
  </div>
  {progress}
</section>
