<section class="slide{bg}" data-step="{step}">
  <div class="top"><span class="kicker">{kicker}</span><span class="idx">{idx}</span></div>
  <div class="body">
    <h1 class="h1 sm">{headline}</h1>
    <div class="rule"></div>
    <ol class="index gap-l{index_cols}">{index_html}</ol>
  </div>
  <div class="foot"><div class="wm"><span class="mark"></span>{wordmark}</div><span class="idx">{footer}</span></div>
  {progress}
</section>
